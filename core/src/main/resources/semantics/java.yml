methods:
  # Iteration
  forEach:        { semantics: iteration }
  forEachOrdered: { semantics: iteration }
  removeIf:       { semantics: iteration, note: "iterates and removes matching elements" }
  stream:         { semantics: iteration, note: "creates stream pipeline" }
  parallelStream: { semantics: iteration, note: "creates parallel stream pipeline" }

  # Lookup
  contains:      { semantics: lookup, kind: CONTAINS }
  containsKey:   { semantics: lookup, kind: CONTAINS, implicitly-o1: true }
  containsValue: { semantics: lookup, kind: CONTAINS, implicitly-o1: true }
  indexOf:       { semantics: lookup, kind: INDEX_OF }
  lastIndexOf:   { semantics: lookup, kind: INDEX_OF }
  find:          { semantics: lookup, kind: FIND }
  filter:        { semantics: lookup, kind: FILTER }
  anyMatch:      { semantics: lookup, kind: ANY_MATCH }
  allMatch:      { semantics: lookup, kind: ALL_MATCH }
  noneMatch:     { semantics: lookup, kind: NONE_MATCH }

  # Sort
  sort:    { semantics: sort, kind: SORT }
  sorted:  { semantics: sort, kind: SORTED }

  # Access
  first:     { semantics: access, kind: FIRST }
  last:      { semantics: access, kind: LAST }
  findFirst: { semantics: access, kind: FIND_FIRST }
  findAny:   { semantics: access, kind: FIND_ANY }
  get:       { semantics: access, kind: INDEX_ZERO, note: "List.get(int); also Map.get" }

  # Blocking
  join: { semantics: blocking, note: "on Future types" }

  # Serialization
  writeValueAsString: { semantics: serialization }
  writeValueAsBytes:  { semantics: serialization }
  readValue:          { semantics: serialization }
  convertValue:       { semantics: serialization }
  valueToTree:        { semantics: serialization }

