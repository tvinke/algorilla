methods:
  # Iteration
  forEach:        { semantics: iteration }
  forEachOrdered: { semantics: iteration }
  removeIf:       { semantics: iteration, note: "iterates and removes matching elements" }
  stream:         { semantics: iteration, note: "creates stream pipeline" }
  parallelStream: { semantics: iteration, note: "creates parallel stream pipeline" }

  # Lookup
  contains:      { semantics: lookup, kind: CONTAINS }
  containsKey:   { semantics: lookup, kind: CONTAINS, implicitly-o1: true }
  containsValue: { semantics: lookup, kind: CONTAINS, implicitly-o1: true }
  indexOf:       { semantics: lookup, kind: INDEX_OF }
  lastIndexOf:   { semantics: lookup, kind: INDEX_OF }
  find:          { semantics: lookup, kind: FIND }
  filter:        { semantics: lookup, kind: FILTER }
  anyMatch:      { semantics: lookup, kind: ANY_MATCH }
  allMatch:      { semantics: lookup, kind: ALL_MATCH }
  noneMatch:     { semantics: lookup, kind: NONE_MATCH }

  # Sort
  sort:    { semantics: sort, kind: SORT }
  sorted:  { semantics: sort, kind: SORTED }

  # Access
  first:     { semantics: access, kind: FIRST }
  last:      { semantics: access, kind: LAST }
  findFirst: { semantics: access, kind: FIND_FIRST }
  findAny:   { semantics: access, kind: FIND_ANY }
  get:       { semantics: access, kind: INDEX_ZERO, note: "List.get(int); also Map.get" }

  # Blocking
  join: { semantics: blocking, note: "on Future types" }

  # Serialization
  writeValueAsString: { semantics: serialization }
  writeValueAsBytes:  { semantics: serialization }
  readValue:          { semantics: serialization }
  convertValue:       { semantics: serialization }
  valueToTree:        { semantics: serialization }

# Stream pipeline operations: methods to strip from variable names and skip
# during cross-method resolution. All methods in the 'methods' section above
# are automatically included — this section is for pipeline ops that don't
# have their own semantic category.
stream-ops:
  - map
  - flatMap
  - mapToInt
  - mapToLong
  - mapToDouble
  - collect
  - reduce
  - peek
  - distinct
  - limit
  - skip
  - toList
  - toSet
  - toMap
  - groupingBy
  - joining
  - counting
  - mapping
  - summarizingInt
  - summarizingLong
  - summarizingDouble
  - partitioningBy
  - groupBy
  - partition
  - zip
  - chunked
  - windowed

# Kotlin-style scope functions that should not be cross-method resolved
scope-ops:
  - apply
  - also
  - let
  - run
  - takeIf
  - takeUnless
  - with
  - of
  - ofNullable

# Methods too cheap to flag as redundant expensive calls
trivial-methods:
  - equals
  - hashCode
  - toString
  - valueOf
  - compareTo
  - isDigit
  - isLetter
  - isUpperCase
  - isLowerCase
  - isWhitespace
  - toIntExact
  - abs
  - min
  - max
  - ceil
  - floor
  - round
  - isEmpty
  - isBlank
  - isPresent
  - isNull
  - isNotNull
  - size
  - length
  - trim
  - lowercase
  - uppercase
  - charAt
  - codePointAt
  - getClass
  - name
  - ordinal
  - get
  - getOrDefault
  - containsKey
  - containsValue
  - contains
  - indexOf
  - lastIndexOf
  - first
  - last
  - getKey
  - getValue
  - getProperty
  - entrySet
  - keySet
  - values
  - just
  - of
  - ofNullable
  - empty
  - orElse
  - orElseGet
  - orElseThrow
  - ifPresent
  - isPresent
  - getOrDefault
  - getOrElse
  - error
  - never
  - defer
  - wrap
  - asList
  - singletonList
  - emptyList
  - emptySet
  - emptyMap
  - singleton
  - noneOf
  - allOf
  - copyOf
  - unmodifiableList
  - unmodifiableSet
  - unmodifiableMap

# Builder-pattern methods called for chaining, not return value
builder-methods:
  - path
  - header
  - param
  - query
  - body
  - accept
  - contentType

heavyweight-types:
  - ObjectMapper
  - Gson
  - XmlMapper
  - DocumentBuilderFactory
  - TransformerFactory
  - Pattern
  - DecimalFormat
  - SimpleDateFormat
  - Collator
  - RuleBasedCollator
  - MessageDigest

o1-types:
  - Set
  - HashSet
  - LinkedHashSet
  - TreeSet
  - Map
  - HashMap
  - TreeMap
  - LinkedHashMap
  - ConcurrentHashMap

# Method name prefixes for getter-pattern detection (shared across rules)
getter-prefixes:
  - get
  - find
  - load
  - fetch
  - lookup
  - resolve

# Constant-time operations too cheap to flag even when duplicated
cheap-methods:
  # Java time/date arithmetic
  - plusDays
  - minusDays
  - plusHours
  - minusHours
  - plusMinutes
  - minusMinutes
  - plusSeconds
  - minusSeconds
  - plusWeeks
  - minusWeeks
  - plusMonths
  - minusMonths
  - ofHours
  - ofMinutes
  - ofSeconds
  - ofMillis
  - ofNanos
  - ofDays
  - toInstant
  - atStartOfDay
  - atZone
  # Reflection / modifier checks
  - isStatic
  - isPublic
  - isPrivate
  - isProtected
  - isAbstract
  - isFinal
  - isInterface
  - isSynthetic
  - isAnnotationPresent
  # String conversions and lookups
  - startsWith
  - endsWith
  - substring
  - replace
  - replaceAll
  - replaceFirst
  - split
  - matches
  - toLowerCase
  - toUpperCase
  - trim
  - strip
  - charAt
  - indexOf
  - lastIndexOf
  - contains
  - isEmpty
  - isBlank
  - length
  - concat
  - valueOf
  - hasText
  - hasLength
  # Type checks / reflection
  - getType
  - getDescriptor
  - getInternalName
  - getMethodDescriptor
  - getReturnType
  - getSort
  - getSize
  - getOpcode
  # Runtime state checks — cheap boolean queries, intentionally called at different points
  - isTerminated
  - isCancelled
  - isDone
  - isActive
  - isAlive
  - isOpen
  - isClosed
  - isRunning
  - isReady
  - isInstance
  - isAssignableFrom
  - isAssignableBound
  # Stream / collector factories — near-zero cost
  - stream
  - parallelStream
  - joining
  - toList
  - toSet
  - toMap
  - toUnmodifiableList
  # Source extraction / context accessors — cheap lookups
  - extractSource
  - getSource

# Sequential read / stateful iteration methods whose return value changes
# on each invocation — not redundant even when called with identical arguments
sequential-read-methods:
  # Binary / byte-stream readers
  - read
  - readByte
  - readShort
  - readUnsignedShort
  - readInt
  - readLong
  - readFloat
  - readDouble
  - readChar
  - readBoolean
  - readUTF
  - readUTF8
  - readClass
  - readLine
  - readAttribute
  # Scanner / tokeniser style iteration
  - next
  - nextByte
  - nextShort
  - nextInt
  - nextLong
  - nextFloat
  - nextDouble
  - nextBoolean
  - nextLine
  - nextToken
  # BitSet iteration
  - nextSetBit
  - nextClearBit
  # Queue / stack / deque stateful operations
  - poll
  - pop
  - take
  # Bytecode / ASM emission instructions (side-effectful, intentionally repeated)
  - push
  - mark
  - load_local
  - load_arg
  - load_this
  - getfield
  - putfield
  - array_load
  - array_store
  - dup
  - swap
  - invoke_virtual
  - invoke_interface
  - invoke_static
  - invoke_constructor
  - checkcast
  - visitVarInsn
  - visitInsn
  - visitFieldInsn
  - visitMethodInsn
  - visitTypeInsn
  - visitLabel
  - visitJumpInsn
  - visitLdcInsn
