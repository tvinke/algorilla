# IO methods — network, database, or file operations that should not appear inside loops.
# Only names that are unambiguously IO; generic names (get, send, write) are too FP-prone
# at the language level — put those in framework overlays with context.
io-methods:
  # JDBC
  - executeQuery
  - executeUpdate
  - executeBatch
  - prepareStatement
  - prepareCall
  # java.net
  - openConnection
  # java.net.http.HttpClient
  - sendAsync

# Methods that produce O(1) collection types (Set, Map).
# Used by the type inference engine to mark variables as O(1) when their
# initializer calls one of these methods. Both factory methods (no receiver)
# and instance methods whose return type is a Set or Map.
o1-factory-methods:
  # Collections utility — wrapping factories
  - unmodifiableSet
  - unmodifiableMap
  - synchronizedSet
  - synchronizedMap
  - singletonMap
  - emptySet
  - emptyMap
  # Map instance methods returning Set
  - keySet
  - entrySet
  # Conversion methods
  - toSet
  - toMap
