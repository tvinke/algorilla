io-target-patterns:
  # Patterns prefixed with * match anywhere (contains). Others match as suffix (endsWith).
  # This prevents "session" matching "sessionState" while still matching "hibernateSession".
  # Use * for patterns that are almost always meaningful as substrings.
  - "*repository"
  - "*service"
  - "*dao"
  - "*jdbc"
  - "*datasource"
  - "*template"
  # Suffix-only: these words appear in non-IO contexts as prefixes (sessionState, channelId)
  - entitymanager
  - session
  - connection
  - channel
  - socket
  - outputstream
  - inputstream
  - writer
  - reader
