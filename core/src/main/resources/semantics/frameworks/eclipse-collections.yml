# Eclipse Collections — framework overlay for Java
# High-performance collections: FastList, UnifiedSet, UnifiedMap, Bag, Multimap, primitives

language: java

methods: {}

collection-types:
  # Mutable list/set/bag
  - FastList
  - MutableList
  - MutableSet
  - MutableBag
  - MutableSortedSet
  - MutableSortedBag
  - MutableSortedMap
  - MutableStack
  - MutableMap
  # Multimap families
  - MutableListMultimap
  - MutableSetMultimap
