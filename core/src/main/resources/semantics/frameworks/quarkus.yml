# Quarkus — framework overlay for Java
# Quarkus, Panache (Active Record + Repository), RESTEasy, CDI, SmallRye

language: java

methods: {}

cheap-methods:
  # Panache entity — static metadata methods (no DB)
  - getEntityClass
  - isPersistent
  # CDI — bean resolution (cached after first lookup)
  - select
  - get
  # RESTEasy — request context accessors
  - getHeaders
  - getMediaType
  - getMethod
  - getUriInfo
  - getLanguage
  - getAcceptableLanguages
  - getAcceptableMediaTypes
  # Mutiny Uni/Multi — reactive operator constructors (no IO until subscribed)
  - onItem
  - onFailure
  - onCompletion
  - transform
  - transformToUni
  - transformToMulti
  - eventually
  - replaceWith
  - replaceIfNullWith
  - ifNoItem
  - chain
  - invoke
  - call
  # SmallRye Mutiny — additional operators
  - map
  - flatMap
  - merge
  - concatenate
  - collect
  - group
  - select
  - skip
  - broadcast
  - toHotStream
  - cache
  - memoize
  - onSubscription
  - onCancellation
  - onTermination
  - onOverflow
  - paceDemand
  - capDemandsTo

heavyweight-types:
  # Quarkus REST client builders
  - RestClientBuilder
  - QuarkusRestClientBuilder

io-methods:
  # Panache Active Record — these hit the database
  - persist
  - persistAndFlush
  - deleteById
  - deleteAll
  - findById
  - findAll
  - listAll
  - update
  - streamAll
  # Panache repository
  - persistAndFlush
  # RESTEasy client — HTTP calls (rx/submit are unambiguous HTTP triggers)
  - rx
  - submit
  # SmallRye Reactive Messaging
  - ack
  - nack

io-method-candidates:
  - find
  - list
  - count
  - delete
  - flush
  # RESTEasy client — invoke() is gated by io-target-patterns to avoid flagging Method.invoke()
  - invoke

io-target-patterns:
  - "*repository"
  - "*resource"
  - "*endpoint"
  - "*client"
  - "*dao"

non-io-targets:
  # Mutiny types — reactive wrappers, not IO
  - uni
  - multi
  - uniemitter
  - multiemitter
  # Panache query builder — no IO until terminal
  - panachequery

monadic-types:
  - Uni
  - Multi

non-repository-targets: []
