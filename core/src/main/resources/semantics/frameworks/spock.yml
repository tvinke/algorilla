# Spock Framework — framework overlay for Groovy
# Testing DSL, mocking, and data-driven specifications

methods: {}

cheap-methods:
  # Mock creation — each produces a distinct mock instance
  - Mock
  - Stub
  - Spy
  - GroovyMock
  - GroovyStub
  - GroovySpy
  - GroovyMock
  # Interaction DSL
  - thrown
  - notThrown
  - noExceptionThrown
  - old
  - with
  - verifyAll
  # Mocking interaction operators
  - getAt
  - leftShift
  - rightShift

trivial-methods:
  # Specification helpers
  - setup
  - cleanup
  - setupSpec
  - cleanupSpec
  - expect
  - when
  - then
  - where
  - and
  - given
