methods:
  # === Iteration ===
  # Array.prototype
  forEach:      { semantics: iteration }
  map:          { semantics: iteration }
  flatMap:      { semantics: iteration }
  flat:         { semantics: iteration, note: "Array.prototype.flat(depth)" }
  reduce:       { semantics: iteration }
  reduceRight:  { semantics: iteration }
  keys:         { semantics: iteration, note: "Array/Map/Set/Object.keys()" }
  values:       { semantics: iteration, note: "Array/Map/Set/Object.values()" }
  entries:      { semantics: iteration, note: "Array/Map/Set/Object.entries()" }
  from:         { semantics: iteration, note: "Array.from() — iterates iterable/array-like" }
  # Object static
  fromEntries:  { semantics: iteration, note: "Object.fromEntries() — iterates iterable of [k,v]" }
  # Map/Set
  # forEach already listed above — shared name
  # Iterator helpers (ES2025)
  toArray:      { semantics: iteration, note: "Iterator.prototype.toArray()" }

  # === Lookup ===
  # Array.prototype
  find:            { semantics: lookup, kind: FIND }
  findIndex:       { semantics: lookup, kind: INDEX_OF }
  findLast:        { semantics: lookup, kind: FIND }
  findLastIndex:   { semantics: lookup, kind: INDEX_OF }
  filter:          { semantics: lookup, kind: FILTER }
  some:            { semantics: lookup, kind: SOME }
  every:           { semantics: lookup, kind: ALL_MATCH }
  includes:        { semantics: lookup, kind: INCLUDES, note: "Array/String/TypedArray" }
  indexOf:         { semantics: lookup, kind: INDEX_OF, note: "Array/String/TypedArray" }
  lastIndexOf:     { semantics: lookup, kind: INDEX_OF, note: "Array/String/TypedArray" }
  # Map/Set
  has:             { semantics: lookup, kind: CONTAINS, implicitly-o1: true, note: "Map/Set/WeakMap/WeakSet.has()" }
  # String.prototype
  search:          { semantics: lookup, kind: INDEX_OF, note: "String.prototype.search(regex)" }
  startsWith:      { semantics: lookup, kind: CONTAINS, note: "String.prototype.startsWith()" }
  endsWith:        { semantics: lookup, kind: CONTAINS, note: "String.prototype.endsWith()" }
  # Set (ES2025 set methods)
  isSubsetOf:      { semantics: lookup, kind: ALL_MATCH, note: "Set.prototype.isSubsetOf()" }
  isSupersetOf:    { semantics: lookup, kind: ALL_MATCH, note: "Set.prototype.isSupersetOf()" }
  isDisjointFrom:  { semantics: lookup, kind: NONE_MATCH, note: "Set.prototype.isDisjointFrom()" }

  # === Sort ===
  sort:       { semantics: sort, kind: SORT, note: "Array.prototype.sort() — mutates" }
  toSorted:   { semantics: sort, kind: SORTED, note: "Array.prototype.toSorted() — non-mutating" }

  # === Access ===
  at:    { semantics: access, kind: FIRST, note: "Array/String/TypedArray.at() — depends on index" }
  pop:   { semantics: access, kind: LAST, note: "removes and returns last element" }
  shift: { semantics: access, kind: FIRST, note: "removes and returns first element" }
  get:   { semantics: access, kind: INDEX_ZERO, note: "Map.get(key) — O(1)" }

  # === Serialization ===
  stringify: { semantics: serialization, note: "JSON.stringify" }
  parse:     { semantics: serialization, note: "JSON.parse" }

  # === Blocking ===
  # Promise-based (conceptually blocking when awaited)
  then:    { semantics: blocking, note: "Promise.then — async continuation" }
  catch:   { semantics: blocking, note: "Promise.catch — async error handler" }
  finally: { semantics: blocking, note: "Promise.finally — async cleanup" }

  # === Copy-on-modify ===
  concat:      { semantics: copy-on-modify, note: "Array/String.concat()" }
  slice:       { semantics: copy-on-modify, note: "Array/String/TypedArray.slice() — shallow copy" }
  splice:      { semantics: copy-on-modify, note: "Array.splice() — mutates, returns removed" }
  toReversed:  { semantics: copy-on-modify, note: "Array.prototype.toReversed()" }
  toSpliced:   { semantics: copy-on-modify, note: "Array.prototype.toSpliced()" }
  with:        { semantics: copy-on-modify, note: "Array.prototype.with(index, value)" }
  # Set (ES2025)
  union:              { semantics: copy-on-modify, note: "Set.prototype.union()" }
  intersection:       { semantics: copy-on-modify, note: "Set.prototype.intersection()" }
  difference:         { semantics: copy-on-modify, note: "Set.prototype.difference()" }
  symmetricDifference: { semantics: copy-on-modify, note: "Set.prototype.symmetricDifference()" }
  # Object static
  assign:  { semantics: copy-on-modify, note: "Object.assign() — shallow copy/merge" }
  freeze:  { semantics: copy-on-modify, note: "Object.freeze() — returns frozen object" }

# Stream pipeline operations: higher-order functions in collection pipelines.
# Methods in the 'methods' section are automatically included — this section
# is for pipeline ops that don't have their own semantic category.
stream-ops:
