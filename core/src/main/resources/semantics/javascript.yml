  - next
  # Generator
  - next
  - return
  - throw
  # Queue / stack / deque stateful operations
  - poll
  - pop
  - take
  - push
  - shift
  - dequeue
  - enqueue
  # Stream reading (Node.js)
  - read
  - readline
  # Scanner / tokeniser style iteration
  - nextLine
  - nextToken
  # Async iterator
  - next
  # EventEmitter (each call may get different event)
