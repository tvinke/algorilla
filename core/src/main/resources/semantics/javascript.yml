methods:
  # Iteration
  forEach: { semantics: iteration }
  map:     { semantics: iteration }
  flatMap: { semantics: iteration }
  reduce:  { semantics: iteration }
  reduceRight: { semantics: iteration }
  keys:    { semantics: iteration, note: "Object.keys()" }
  values:  { semantics: iteration, note: "Object.values()" }
  entries: { semantics: iteration, note: "Object.entries()" }

  # Lookup
  find:      { semantics: lookup, kind: FIND }
  findIndex: { semantics: lookup, kind: INDEX_OF }
  findLast:  { semantics: lookup, kind: FIND }
  findLastIndex: { semantics: lookup, kind: INDEX_OF }
  filter:    { semantics: lookup, kind: FILTER }
  some:      { semantics: lookup, kind: SOME }
  every:     { semantics: lookup, kind: ALL_MATCH }
  includes:  { semantics: lookup, kind: INCLUDES }
  indexOf:   { semantics: lookup, kind: INDEX_OF }
  lastIndexOf: { semantics: lookup, kind: INDEX_OF }

  # Sort
  sort:     { semantics: sort, kind: SORT }
  toSorted: { semantics: sort, kind: SORTED }

  # Access
  at: { semantics: access, kind: FIRST, note: "depends on index" }

  # Serialization
  stringify: { semantics: serialization, note: "JSON.stringify" }
  parse:     { semantics: serialization, note: "JSON.parse" }

  # Copy-on-modify
  concat:  { semantics: copy-on-modify }
  slice:   { semantics: copy-on-modify, note: "returns shallow copy of portion" }
  splice:  { semantics: copy-on-modify, note: "mutates array, returns removed elements" }

stream-ops:
  - map
  - flatMap
  - reduce
  - reduceRight
  - flat
  - fill
  - from
  - of

scope-ops: []

trivial-methods:
  - length
  - size
  - toString
  - valueOf
  - hasOwnProperty
  - indexOf
  - lastIndexOf
  - includes
  - charAt
  - charCodeAt
  - trim
  - toLowerCase
  - toUpperCase
  - keys
  - values
  - entries
  - has
  - get
  - set
  - delete

builder-methods: []

heavyweight-types:
  - RegExp

o1-types:
  - Set
  - Map
  - WeakSet
  - WeakMap

getter-prefixes:
  - get
  - find
  - load
  - fetch
  - lookup
  - resolve
