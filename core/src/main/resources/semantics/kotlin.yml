  # Scanner / tokeniser style iteration
  - next
  - nextByte
  - nextShort
  - nextInt
  - nextLong
  - nextFloat
  - nextDouble
  - nextBoolean
  - nextLine
  - nextToken
  # BitSet iteration
  - nextSetBit
  - nextClearBit
  # Queue / stack / deque stateful operations
  - poll
  - pop
  - take
  # Bytecode / ASM emission instructions (side-effectful, intentionally repeated)
  - push
