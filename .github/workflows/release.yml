name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set release version in gradle.properties
        run: sed -i "s/^version=.*/version=${{ steps.version.outputs.version }}/" gradle.properties

      - name: Build and test
        run: ./gradlew build

      - name: Build shadow JAR
        run: ./gradlew :cli:shadowJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: algorilla-jar
          path: cli/build/libs/algorilla-*.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: false
          files: |
            cli/build/libs/algorilla-*.jar

      - name: Update floating major tag
        run: |
          MAJOR_TAG="v$(echo "${{ steps.version.outputs.version }}" | cut -d. -f1)"
          git tag -f "$MAJOR_TAG" "$GITHUB_REF_NAME"
          git push -f origin "$MAJOR_TAG"

  publish-gradle-plugin:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set release version in gradle.properties
        run: sed -i "s/^version=.*/version=${{ needs.build.outputs.version }}/" gradle.properties

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: algorilla-jar
          path: npm/lib/

      - name: Rename JAR
        run: mv npm/lib/algorilla-*.jar npm/lib/algorilla.jar

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set npm version
        run: |
          cd npm
          npm version ${{ needs.build.outputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: |
          cd npm
          npm publish --access public || {
            if npm view algorilla@${{ needs.build.outputs.version }} version 2>/dev/null; then
              echo "Version ${{ needs.build.outputs.version }} already published — skipping"
            else
              exit 1
            fi
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  bump-snapshot:
    needs: [build, publish-gradle-plugin, publish-npm, publish-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump to next SNAPSHOT
        run: |
          RELEASED="${{ needs.build.outputs.version }}"
          MAJOR=$(echo "$RELEASED" | cut -d. -f1)
          MINOR=$(echo "$RELEASED" | cut -d. -f2)
          PATCH=$(echo "$RELEASED" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          sed -i "s/^version=.*/version=$NEXT/" gradle.properties
          echo "Bumping version to $NEXT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git diff --cached --quiet && echo "Already at next SNAPSHOT, nothing to commit" && exit 0
          git commit -m "chore: bump to ${{ needs.build.outputs.version }} → next SNAPSHOT"
          git push origin main

  publish-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: algorilla-jar
          path: cli/build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
