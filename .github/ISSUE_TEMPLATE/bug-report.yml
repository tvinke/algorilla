name: Bug Report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `algorilla --format sarif .`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error output / logs
      description: Paste any error messages or relevant output. Run with `--verbose` for more detail.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Algorilla version
      placeholder: e.g. 0.2.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - npm / npx
        - Gradle plugin
        - GitHub Action
        - Docker
        - JAR download
        - Built from source
    validations:
      required: false

  - type: input
    id: java
    attributes:
      label: Java version
      placeholder: e.g. Java 21.0.2, Temurin
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: false
