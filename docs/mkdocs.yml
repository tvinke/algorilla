site_name: Algorilla
site_description: Detect algorithmic complexity anti-patterns in your codebase
site_url: https://tvinke.github.io/algorilla/
repo_url: https://github.com/tvinke/algorilla
repo_name: tvinke/algorilla

theme:
  name: material
  font:
    text: Inter
    code: Fira Code
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - content.code.copy
    - search.highlight
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Guide:
    - index.md
    - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
    - Concepts:
      - The Hidden O(n²) Problem: hidden-complexity.md
      - The Hidden Triple Scan: hidden-duplication.md
      - The Hidden N+1: hidden-io.md
      - Big-O Primer: concepts/big-o-primer.md
      - How Detection Works: concepts/how-detection-works.md
      - Cross-File Analysis: concepts/cross-file-analysis.md
    - Changelog: changelog.md
    - Stability & Compatibility: stability.md
    - Using Algorilla:
      - Workflow: guide/workflow.md
      - Understanding Output: guide/understanding-output.md
      - CLI Reference: guide/cli-reference.md
      - Project Detection: guide/project-detection.md
      - Suppression: guide/suppression.md
    - Advanced:
      - CI/CD Integration: guide/ci-integration.md
      - Baseline Workflow: guide/baseline-workflow.md
      - Incremental Analysis: guide/incremental-analysis.md
      - Custom Rules: guide/custom-rules.md
      - Multi-Language Support: guide/multi-language.md
      - Pre-Commit Hooks: guide/pre-commit.md
  - Rules:
    - Overview: rules/index.md
    - Loop Amplifiers:
      - Nested Lookup: rules/nested-lookup.md
      - Repeated Linear Scan: rules/repeated-linear-scan.md
      - Repeated Regex in Loop: rules/repeated-regex-in-loop.md
      - Implicit Regex in Loop: rules/implicit-regex-in-loop.md
      - Expensive Serialization in Loop: rules/expensive-serialization-in-loop.md
      - Sequential Async Join in Loop: rules/sequential-async-join-in-loop.md
      - In-Loop Collection Building: rules/in-loop-collection-building.md
      - String Concat in Loop: rules/string-concat-in-loop.md
      - Quadratic Removal: rules/quadratic-removal.md
      - Repeated Reflection in Loop: rules/repeated-reflection-in-loop.md
      - Hidden Nested Loop: rules/hidden-nested-loop.md
      - Expensive Callback: rules/expensive-callback.md
    - Sort Abuse:
      - Sort for Last: rules/sort-for-last.md
      - Expensive Sort Comparator: rules/expensive-sort-comparator.md
      - Filter After Sort: rules/filter-after-sort.md
    - Query Patterns:
      - N+1 Query: rules/n-plus-one-query.md
      - Bulk Load for Single Lookup: rules/bulk-load-for-single-lookup.md
    - Construction Cost:
      - Expensive Construction: rules/expensive-construction.md
    - Redundancy:
