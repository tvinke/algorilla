site_name: Algorilla
site_description: Detect algorithmic complexity anti-patterns in your codebase
site_url: https://tvinke.github.io/algorilla/
repo_url: https://github.com/tvinke/algorilla
repo_name: tvinke/algorilla

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - Rules:
    - Overview: rules/index.md
    - Loop Amplifiers:
      - Nested Lookup: rules/nested-lookup.md
      - Repeated Linear Scan: rules/repeated-linear-scan.md
      - Repeated Regex in Loop: rules/repeated-regex-in-loop.md
      - Expensive Serialization in Loop: rules/expensive-serialization-in-loop.md
      - Sequential Async Join in Loop: rules/sequential-async-join-in-loop.md
      - In-Loop Collection Building: rules/in-loop-collection-building.md
    - Sort Abuse:
      - Sort for Last: rules/sort-for-last.md
      - Expensive Sort Comparator: rules/expensive-sort-comparator.md
      - Date in Sort: rules/date-in-sort.md
      - Filter After Sort: rules/filter-after-sort.md
    - Query Patterns:
      - N+1 Query: rules/n-plus-one-query.md
      - Bulk Load for Single Lookup: rules/full-scan-for-single-lookup.md
    - Construction Cost:
      - Expensive Construction: rules/heavyweight-object-per-invocation.md
    - Redundancy:
      - Redundant Expensive Call: rules/redundant-expensive-call.md
      - Uncached Getter: rules/uncached-getter.md
      - Chained Getters: rules/chained-getters.md
  - Guide:
    - Understanding Output: guide/understanding-output.md
    - CLI Reference: guide/cli-reference.md
    - Project Detection: guide/project-detection.md
    - CI/CD Integration: guide/ci-integration.md
    - Baseline Workflow: guide/baseline-workflow.md
    - Incremental Analysis: guide/incremental-analysis.md
    - Custom Rules: guide/custom-rules.md
    - Multi-Language Support: guide/multi-language.md
    - Suppression: guide/suppression.md
    - Pre-Commit Hooks: guide/pre-commit.md
  - Concepts:
    - Big-O Primer: concepts/big-o-primer.md
    - How Detection Works: concepts/how-detection-works.md
    - Cross-File Analysis: concepts/cross-file-analysis.md
  - Developer:
    - Development Guidelines: developer/guidelines.md
    - Coding Conventions: developer/coding-conventions.md
    - Building: developer/building.md
    - Architecture: developer/architecture.md
    - Adding Rules: developer/adding-rules.md
    - Adding Languages: developer/adding-languages.md
    - Testing: developer/testing.md
    - Releasing: developer/releasing.md
  - Changelog: changelog.md
